<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460">
  <defs>
    <linearGradient id="bg-grad-bp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="100%" style="stop-color:#030711"/>
    </linearGradient>
    <linearGradient id="card-bp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2038"/>
      <stop offset="100%" style="stop-color:#071424"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="460" fill="url(#bg-grad-bp)" rx="14"/>
  <rect x="1" y="1" width="818" height="458" fill="none" stroke="#1e3a5f" stroke-width="1" rx="13"/>

  <!-- Header -->
  <text x="410" y="38" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="18" font-weight="800" fill="#ffffff">Privileged Account Management Best Practices</text>
  <text x="410" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8">7-Step Lifecycle for One Identity Privileged Access Management Security</text>

  <!-- Row 1: 4 Steps -->
  <!-- Step 1 -->
  <g transform="translate(30, 80)">
    <rect width="175" height="150" rx="10" fill="url(#card-bp)" stroke="#00B8FF" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="28" cy="28" r="14" fill="#00B8FF" opacity="0.2"/>
    <text x="28" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="#00B8FF">01</text>
    <text x="135" y="32" text-anchor="end" font-size="20">🔍</text>
    <text x="16" y="70" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Discover Privileged</text>
    <text x="16" y="86" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Accounts</text>
    <text x="16" y="110" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">Scan &amp; catalog admin,</text>
    <text x="16" y="124" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">service, cloud &amp; API keys.</text>
    <text x="16" y="138" font-family="Arial,sans-serif" font-size="9" fill="#38bdf8">Eliminate shadow accounts</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(225, 80)">
    <rect width="175" height="150" rx="10" fill="url(#card-bp)" stroke="#22c55e" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="28" cy="28" r="14" fill="#22c55e" opacity="0.2"/>
    <text x="28" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="#22c55e">02</text>
    <text x="135" y="32" text-anchor="end" font-size="20">🛡️</text>
    <text x="16" y="70" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Apply Least</text>
    <text x="16" y="86" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Privilege</text>
    <text x="16" y="110" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">Restrict permissions to</text>
    <text x="16" y="124" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">only what is strictly needed.</text>
    <text x="16" y="138" font-family="Arial,sans-serif" font-size="9" fill="#4ade80">Zero unrestricted admin</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(420, 80)">
    <rect width="175" height="150" rx="10" fill="url(#card-bp)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="28" cy="28" r="14" fill="#6366f1" opacity="0.2"/>
    <text x="28" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="#818cf8">03</text>
    <text x="135" y="32" text-anchor="end" font-size="20">⏳</text>
    <text x="16" y="70" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Use Just-in-Time</text>
    <text x="16" y="86" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">(JIT) Access</text>
    <text x="16" y="110" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">Grant time-limited elevation</text>
    <text x="16" y="124" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">on-demand with auto-expiry.</text>
    <text x="16" y="138" font-family="Arial,sans-serif" font-size="9" fill="#a5b4fc">No standing privilege</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(615, 80)">
    <rect width="175" height="150" rx="10" fill="url(#card-bp)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="28" cy="28" r="14" fill="#f59e0b" opacity="0.2"/>
    <text x="28" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="#f59e0b">04</text>
    <text x="135" y="32" text-anchor="end" font-size="20">🔐</text>
    <text x="16" y="70" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Protect &amp; Rotate</text>
    <text x="16" y="86" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Credentials</text>
    <text x="16" y="110" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">Centralized secret vaulting</text>
    <text x="16" y="124" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">with automated rotations.</text>
    <text x="16" y="138" font-family="Arial,sans-serif" font-size="9" fill="#fcd34d">Eliminate static passwords</text>
  </g>

  <!-- Row 2: 3 Steps -->
  <!-- Step 5 -->
  <g transform="translate(30, 250)">
    <rect width="236" height="135" rx="10" fill="url(#card-bp)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="28" cy="28" r="14" fill="#ec4899" opacity="0.2"/>
    <text x="28" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="#ec4899">05</text>
    <text x="210" y="32" text-anchor="end" font-size="20">📱</text>
    <text x="16" y="68" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Enable Strong Authentication</text>
    <text x="16" y="90" font-family="Arial,sans-serif" font-size="9.5" fill="#94a3b8">Mandate MFA (FIDO2, hardware keys, TOTP)</text>
    <text x="16" y="106" font-family="Arial,sans-serif" font-size="9.5" fill="#94a3b8">for all administrative access sessions.</text>
    <text x="16" y="122" font-family="Arial,sans-serif" font-size="9" fill="#f472b6">Phishing-resistant verification</text>
  </g>

  <!-- Step 6 -->
  <g transform="translate(292, 250)">
    <rect width="236" height="135" rx="10" fill="url(#card-bp)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="28" cy="28" r="14" fill="#06b6d4" opacity="0.2"/>
    <text x="28" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="#06b6d4">06</text>
    <text x="210" y="32" text-anchor="end" font-size="20">📹</text>
    <text x="16" y="68" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Monitor Privileged Activity</text>
    <text x="16" y="90" font-family="Arial,sans-serif" font-size="9.5" fill="#94a3b8">Live session monitoring, keystroke logging</text>
    <text x="16" y="106" font-family="Arial,sans-serif" font-size="9.5" fill="#94a3b8">and forensic tamper-proof audit trails.</text>
    <text x="16" y="122" font-family="Arial,sans-serif" font-size="9" fill="#22d3ee">Real-time incident visibility</text>
  </g>

  <!-- Step 7 -->
  <g transform="translate(554, 250)">
    <rect width="236" height="135" rx="10" fill="url(#card-bp)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="28" cy="28" r="14" fill="#10b981" opacity="0.2"/>
    <text x="28" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="#10b981">07</text>
    <text x="210" y="32" text-anchor="end" font-size="20">📋</text>
    <text x="16" y="68" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Review Access Regularly</text>
    <text x="16" y="90" font-family="Arial,sans-serif" font-size="9.5" fill="#94a3b8">Routine privilege recertification and pruning</text>
    <text x="16" y="106" font-family="Arial,sans-serif" font-size="9.5" fill="#94a3b8">as organizational roles and duties shift.</text>
    <text x="16" y="122" font-family="Arial,sans-serif" font-size="9" fill="#34d399">Prevent privilege creep &amp; sprawl</text>
  </g>

  <!-- Footer tagline -->
  <text x="410" y="422" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#64748b">One Identity Privileged Access Management · OmniPriv Security Framework</text>
</svg>
