<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460">
  <defs>
    <linearGradient id="bg-grad-ev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="100%" style="stop-color:#030711"/>
    </linearGradient>
    <linearGradient id="card-ev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e223a"/>
      <stop offset="100%" style="stop-color:#061322"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="460" fill="url(#bg-grad-ev)" rx="14"/>
  <rect x="1" y="1" width="818" height="458" fill="none" stroke="#1e3a5f" stroke-width="1" rx="13"/>

  <!-- Header -->
  <text x="410" y="38" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="18" font-weight="800" fill="#ffffff">Evaluating Enterprise PAM Systems &amp; Business Requirements</text>
  <text x="410" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8">6 Core Evaluation Pillars for One Identity Privileged Access Management Selection</text>

  <!-- Grid: 2 rows of 3 cards -->
  <!-- Card 1: Identity Coverage -->
  <g transform="translate(35, 80)">
    <rect width="230" height="150" rx="10" fill="url(#card-ev)" stroke="#00B8FF" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="28" cy="28" r="14" fill="#00B8FF" opacity="0.2"/>
    <text x="28" y="34" text-anchor="middle" font-size="16">👥</text>
    <text x="52" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Identity Coverage</text>
    <text x="16" y="65" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Human &amp; Non-Human Support</text>
    <text x="16" y="86" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">• Sysadmins, Cloud &amp; DB admins</text>
    <text x="16" y="104" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">• Machine IDs, APIs, and DevOps</text>
    <text x="16" y="122" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">• External contractors &amp; vendors</text>
  </g>

  <!-- Card 2: Access Control -->
  <g transform="translate(295, 80)">
    <rect width="230" height="150" rx="10" fill="url(#card-ev)" stroke="#22c55e" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="28" cy="28" r="14" fill="#22c55e" opacity="0.2"/>
    <text x="28" y="34" text-anchor="middle" font-size="16">🛡️</text>
    <text x="52" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Access Control</text>
    <text x="16" y="65" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#4ade80">Granular &amp; Policy-Based</text>
    <text x="16" y="86" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">• Zero standing privileges</text>
    <text x="16" y="104" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">• Command filtering &amp; restrictions</text>
    <text x="16" y="122" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">• Dynamic JIT permission elevation</text>
  </g>

  <!-- Card 3: Adaptive Access -->
  <g transform="translate(555, 80)">
    <rect width="230" height="150" rx="10" fill="url(#card-ev)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="28" cy="28" r="14" fill="#f59e0b" opacity="0.2"/>
    <text x="28" y="34" text-anchor="middle" font-size="16">⚡</text>
    <text x="52" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Adaptive Access</text>
    <text x="16" y="65" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#fbbf24">Context &amp; Risk Driven</text>
    <text x="16" y="86" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">• Contextual identity &amp; device checks</text>
    <text x="16" y="104" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">• Real-time threat &amp; risk scoring</text>
    <text x="16" y="122" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">• Step-up MFA trigger mechanisms</text>
  </g>

  <!-- Card 4: Visibility -->
  <g transform="translate(35, 250)">
    <rect width="230" height="150" rx="10" fill="url(#card-ev)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="28" cy="28" r="14" fill="#6366f1" opacity="0.2"/>
    <text x="28" y="34" text-anchor="middle" font-size="16">📊</text>
    <text x="52" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Central Visibility</text>
    <text x="16" y="65" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#a5b4fc">Single-Pane Governance</text>
    <text x="16" y="86" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">• Central inventory of all privileges</text>
    <text x="16" y="104" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">• Tamper-proof session video audit</text>
    <text x="16" y="122" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">• Instant forensic analysis &amp; alerts</text>
  </g>

  <!-- Card 5: Automation -->
  <g transform="translate(295, 250)">
    <rect width="230" height="150" rx="10" fill="url(#card-ev)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="28" cy="28" r="14" fill="#ec4899" opacity="0.2"/>
    <text x="28" y="34" text-anchor="middle" font-size="16">⚙️</text>
    <text x="52" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Workflow Automation</text>
    <text x="16" y="65" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#f472b6">Operational Efficiency</text>
    <text x="16" y="86" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">• Automated credential rotation</text>
    <text x="16" y="104" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">• Self-service approval workflows</text>
    <text x="16" y="122" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">• Automatic privilege expiration</text>
  </g>

  <!-- Card 6: Ecosystem Integration -->
  <g transform="translate(555, 250)">
    <rect width="230" height="150" rx="10" fill="url(#card-ev)" stroke="#14b8a6" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="28" cy="28" r="14" fill="#14b8a6" opacity="0.2"/>
    <text x="28" y="34" text-anchor="middle" font-size="16">🔌</text>
    <text x="52" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Enterprise Integration</text>
    <text x="16" y="65" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#2dd4bf">Ecosystem Compatibility</text>
    <text x="16" y="86" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">• Active Directory &amp; Okta SSO</text>
    <text x="16" y="104" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">• SIEM, SOAR &amp; Splunk / Sentinel</text>
    <text x="16" y="122" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">• ServiceNow &amp; Jira ticketing</text>
  </g>

  <!-- Tagline -->
  <text x="410" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#64748b">One Identity Privileged Access Management · Omnipriv Enterprise PAM Evaluation</text>
</svg>
