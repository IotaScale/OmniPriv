<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="100%" style="stop-color:#030711"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e2038"/>
      <stop offset="100%" style="stop-color:#071322"/>
    </linearGradient>
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003a61"/>
      <stop offset="100%" style="stop-color:#071c33"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00B8FF"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="820" height="440" fill="url(#bg-grad)" rx="14"/>
  <rect x="1" y="1" width="818" height="438" fill="none" stroke="#1e3a5f" stroke-width="1" rx="13"/>

  <!-- Grid lines background -->
  <g opacity="0.10" stroke="#00B8FF" stroke-width="0.5">
    <line x1="60" y1="0" x2="60" y2="440"/>
    <line x1="200" y1="0" x2="200" y2="440"/>
    <line x1="410" y1="0" x2="410" y2="440"/>
    <line x1="620" y1="0" x2="620" y2="440"/>
    <line x1="760" y1="0" x2="760" y2="440"/>
    <line x1="0" y1="70" x2="820" y2="70"/>
    <line x1="0" y1="180" x2="820" y2="180"/>
    <line x1="0" y1="300" x2="820" y2="300"/>
    <line x1="0" y1="380" x2="820" y2="380"/>
  </g>

  <!-- Header Section -->
  <text x="410" y="38" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="0.3">One Identity Privileged Access Management Architecture</text>
  <text x="410" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8">Centralized Identity-Centric Privilege Control, Zero Trust Governance &amp; Session Audit</text>

  <!-- Connection Lines Behind -->
  <path d="M 230 145 L 290 145 L 290 220 L 305 220" fill="none" stroke="#00B8FF" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
  <path d="M 230 220 L 305 220" fill="none" stroke="#00B8FF" stroke-width="2" opacity="0.9"/>
  <path d="M 230 300 L 290 300 L 290 220 L 305 220" fill="none" stroke="#00B8FF" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>

  <path d="M 515 220 L 590 145" fill="none" stroke="#00B8FF" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
  <path d="M 515 220 L 590 220" fill="none" stroke="#00B8FF" stroke-width="2" opacity="0.9"/>
  <path d="M 515 220 L 590 300" fill="none" stroke="#00B8FF" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>

  <!-- LEFT COLUMN: Privileged Identities -->
  <g transform="translate(30, 80)">
    <rect width="200" height="280" rx="12" fill="url(#card-grad)" stroke="#1e3a5f" stroke-width="1"/>
    
    <rect x="0" y="0" width="200" height="36" rx="12" fill="#132742"/>
    <text x="100" y="23" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#38bdf8">PRIVILEGED IDENTITIES</text>

    <!-- Item 1: IT Admins -->
    <g transform="translate(12, 46)">
      <rect width="176" height="46" rx="8" fill="#09182b" stroke="#1d4068" stroke-width="1"/>
      <circle cx="23" cy="23" r="13" fill="#0284c7" opacity="0.3"/>
      <text x="23" y="28" text-anchor="middle" font-size="13">👤</text>
      <text x="44" y="20" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">IT &amp; Domain Admins</text>
      <text x="44" y="34" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">Infrastructure &amp; Network</text>
    </g>

    <!-- Item 2: Cloud / DevOps -->
    <g transform="translate(12, 100)">
      <rect width="176" height="46" rx="8" fill="#09182b" stroke="#1d4068" stroke-width="1"/>
      <circle cx="23" cy="23" r="13" fill="#6366f1" opacity="0.3"/>
      <text x="23" y="28" text-anchor="middle" font-size="13">💻</text>
      <text x="44" y="20" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Cloud &amp; DevOps</text>
      <text x="44" y="34" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">AWS, Azure, K8s, CI/CD</text>
    </g>

    <!-- Item 3: Service & Machine Accounts -->
    <g transform="translate(12, 154)">
      <rect width="176" height="46" rx="8" fill="#09182b" stroke="#1d4068" stroke-width="1"/>
      <circle cx="23" cy="23" r="13" fill="#10b981" opacity="0.3"/>
      <text x="23" y="28" text-anchor="middle" font-size="13">🤖</text>
      <text x="44" y="20" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Service &amp; App IDs</text>
      <text x="44" y="34" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">APIs, Daemons, Scripts</text>
    </g>

    <!-- Item 4: Third-Party -->
    <g transform="translate(12, 208)">
      <rect width="176" height="46" rx="8" fill="#09182b" stroke="#1d4068" stroke-width="1"/>
      <circle cx="23" cy="23" r="13" fill="#f59e0b" opacity="0.3"/>
      <text x="23" y="28" text-anchor="middle" font-size="13">🏢</text>
      <text x="44" y="20" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Third-Party &amp; Vendors</text>
      <text x="44" y="34" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">Contractors &amp; Remote</text>
    </g>
  </g>

  <!-- CENTER: One Identity PAM Control Plane -->
  <g transform="translate(305, 80)">
    <rect width="210" height="280" rx="12" fill="url(#core-grad)" stroke="#00B8FF" stroke-width="1.8"/>
    
    <!-- Shield Header -->
    <rect x="0" y="0" width="210" height="42" rx="12" fill="#002447"/>
    <text x="105" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="#00B8FF">ONE IDENTITY PAM</text>
    <text x="105" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">Zero-Trust Policy &amp; Security Core</text>

    <!-- Core Module 1 -->
    <g transform="translate(12, 50)">
      <rect width="186" height="36" rx="6" fill="#0c223a" stroke="#00B8FF" stroke-width="0.8" stroke-opacity="0.6"/>
      <text x="12" y="18" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff">🔐 Credential Vault &amp; Rotation</text>
      <text x="12" y="30" font-family="Arial,sans-serif" font-size="8" fill="#94a3b8">Automated AES-256 Vaulting</text>
    </g>

    <!-- Core Module 2 -->
    <g transform="translate(12, 92)">
      <rect width="186" height="36" rx="6" fill="#0c223a" stroke="#00B8FF" stroke-width="0.8" stroke-opacity="0.6"/>
      <text x="12" y="18" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff">⏳ Just-in-Time (JIT) Access</text>
      <text x="12" y="30" font-family="Arial,sans-serif" font-size="8" fill="#94a3b8">Ephemeral Privileges &amp; Expiry</text>
    </g>

    <!-- Core Module 3 -->
    <g transform="translate(12, 134)">
      <rect width="186" height="36" rx="6" fill="#0c223a" stroke="#00B8FF" stroke-width="0.8" stroke-opacity="0.6"/>
      <text x="12" y="18" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff">🛡️ Granular Least Privilege</text>
      <text x="12" y="30" font-family="Arial,sans-serif" font-size="8" fill="#94a3b8">Role &amp; Attribute Based (RBAC/ABAC)</text>
    </g>

    <!-- Core Module 4 -->
    <g transform="translate(12, 176)">
      <rect width="186" height="36" rx="6" fill="#0c223a" stroke="#00B8FF" stroke-width="0.8" stroke-opacity="0.6"/>
      <text x="12" y="18" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff">📹 Session Recording &amp; Audit</text>
      <text x="12" y="30" font-family="Arial,sans-serif" font-size="8" fill="#94a3b8">Live Monitoring &amp; Video Playback</text>
    </g>

    <!-- Core Module 5 -->
    <g transform="translate(12, 218)">
      <rect width="186" height="42" rx="6" fill="#0c223a" stroke="#00B8FF" stroke-width="0.8" stroke-opacity="0.6"/>
      <text x="12" y="18" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff">⚡ Adaptive MFA &amp; Policies</text>
      <text x="12" y="32" font-family="Arial,sans-serif" font-size="8" fill="#94a3b8">Context &amp; Risk-Aware Approvals</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Target Systems -->
  <g transform="translate(590, 80)">
    <rect width="200" height="280" rx="12" fill="url(#card-grad)" stroke="#1e3a5f" stroke-width="1"/>
    
    <rect x="0" y="0" width="200" height="36" rx="12" fill="#132742"/>
    <text x="100" y="23" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#38bdf8">TARGET RESOURCES</text>

    <!-- Target 1: Multi-Cloud -->
    <g transform="translate(12, 46)">
      <rect width="176" height="46" rx="8" fill="#09182b" stroke="#1d4068" stroke-width="1"/>
      <circle cx="23" cy="23" r="13" fill="#0284c7" opacity="0.3"/>
      <text x="23" y="28" text-anchor="middle" font-size="13">☁️</text>
      <text x="44" y="20" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Multi-Cloud Platforms</text>
      <text x="44" y="34" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">AWS, Azure, GCP Portals</text>
    </g>

    <!-- Target 2: Databases -->
    <g transform="translate(12, 100)">
      <rect width="176" height="46" rx="8" fill="#09182b" stroke="#1d4068" stroke-width="1"/>
      <circle cx="23" cy="23" r="13" fill="#10b981" opacity="0.3"/>
      <text x="23" y="28" text-anchor="middle" font-size="13">🗄️</text>
      <text x="44" y="20" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Enterprise Databases</text>
      <text x="44" y="34" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">SQL, Oracle, PostgreSQL</text>
    </g>

    <!-- Target 3: Servers & Kubernetes -->
    <g transform="translate(12, 154)">
      <rect width="176" height="46" rx="8" fill="#09182b" stroke="#1d4068" stroke-width="1"/>
      <circle cx="23" cy="23" r="13" fill="#6366f1" opacity="0.3"/>
      <text x="23" y="28" text-anchor="middle" font-size="13">🖥️</text>
      <text x="44" y="20" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Servers &amp; Clusters</text>
      <text x="44" y="34" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">Linux SSH, Windows RDP</text>
    </g>

    <!-- Target 4: Enterprise Apps -->
    <g transform="translate(12, 208)">
      <rect width="176" height="46" rx="8" fill="#09182b" stroke="#1d4068" stroke-width="1"/>
      <circle cx="23" cy="23" r="13" fill="#ec4899" opacity="0.3"/>
      <text x="23" y="28" text-anchor="middle" font-size="13">⚙️</text>
      <text x="44" y="20" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Critical SaaS &amp; APIs</text>
      <text x="44" y="34" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">ERP, CRM &amp; Admin Panels</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <rect x="30" y="375" width="760" height="46" rx="10" fill="#071525" stroke="#00B8FF" stroke-width="1" stroke-opacity="0.3"/>
  <text x="120" y="403" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8">Pillar 1: <tspan fill="#00B8FF" font-weight="700">Least Privilege</tspan></text>
  <text x="290" y="403" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8">Pillar 2: <tspan fill="#22c55e" font-weight="700">Just-in-Time (JIT)</tspan></text>
  <text x="480" y="403" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8">Pillar 3: <tspan fill="#f59e0b" font-weight="700">Continuous Audit</tspan></text>
  <text x="680" y="403" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8">Pillar 4: <tspan fill="#38bdf8" font-weight="700">Centralized Control</tspan></text>
</svg>
