  <text x="410" y="361" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">PIM <tspan fill="#00B8FF" font-weight="700">defines who gets access</tspan>PAM <tspan fill="#00B8FF" font-weight="700">secures how access is used</tspan></text>
  <text x="410" y="378" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#475569">PIM vs PAM · omnipriv.com</text>
