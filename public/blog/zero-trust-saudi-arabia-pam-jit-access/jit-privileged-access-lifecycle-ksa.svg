<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420">
  <defs>
    <linearGradient id="bg-jit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="100%" style="stop-color:#030711"/>
    </linearGradient>
    <linearGradient id="step-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e223a"/>
      <stop offset="100%" style="stop-color:#07162c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="420" fill="url(#bg-jit)" rx="14"/>
  <rect x="1" y="1" width="818" height="418" fill="none" stroke="#1e3a5f" stroke-width="1" rx="13"/>

  <!-- Title Banner -->
  <text x="410" y="36" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="18" font-weight="800" fill="#ffffff">Enterprise JIT Privileged Access Lifecycle</text>
  <text x="410" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8">The 5-Stage Zero Trust Workflow: Eliminating Standing Privileges in Saudi Organizations</text>

  <!-- 5 Horizontal Process Steps -->
  <!-- STEP 1 -->
  <g transform="translate(20, 85)">
    <rect width="144" height="235" rx="10" fill="url(#step-grad)" stroke="#00B8FF" stroke-width="1.2"/>
    <rect width="144" height="26" rx="10" fill="#00B8FF" fill-opacity="0.15"/>
    <text x="72" y="18" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="800" fill="#00B8FF">STAGE 1</text>
    <circle cx="72" cy="55" r="20" fill="#00B8FF" fill-opacity="0.15" stroke="#00B8FF" stroke-width="1"/>
    <text x="72" y="61" text-anchor="middle" font-size="18">📝</text>

    <text x="72" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">JIT Request</text>

    <line x1="15" y1="108" x2="129" y2="108" stroke="#1e3a5f" stroke-width="0.8"/>
    
    <text x="12" y="128" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#38bdf8">4 Key Questions:</text>
    <text x="12" y="146" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• Who needs access?</text>
    <text x="12" y="164" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• What resource?</text>
    <text x="12" y="182" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• Why (Ticket/Reason)?</text>
    <text x="12" y="200" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• How long (window)?</text>

    <rect x="10" y="212" width="124" height="16" rx="4" fill="#0369a1" fill-opacity="0.4"/>
    <text x="72" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="600" fill="#7dd3fc">Pre-Access Validation</text>
  </g>

  <!-- ARROW 1 -->
  <path d="M 168 185 L 176 185" stroke="#00B8FF" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="172" y="180" text-anchor="middle" font-size="14" fill="#00B8FF">→</text>

  <!-- STEP 2 -->
  <g transform="translate(178, 85)">
    <rect width="144" height="235" rx="10" fill="url(#step-grad)" stroke="#6366f1" stroke-width="1.2"/>
    <rect width="144" height="26" rx="10" fill="#6366f1" fill-opacity="0.15"/>
    <text x="72" y="18" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="800" fill="#a5b4fc">STAGE 2</text>
    <circle cx="72" cy="55" r="20" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1"/>
    <text x="72" y="61" text-anchor="middle" font-size="18">🔐</text>

    <text x="72" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">MFA &amp; Approval</text>

    <line x1="15" y1="108" x2="129" y2="108" stroke="#1e3a5f" stroke-width="0.8"/>
    
    <text x="12" y="128" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#818cf8">Verification Controls:</text>
    <text x="12" y="146" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• Hardware / App MFA</text>
    <text x="12" y="164" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• Contextual Policy Check</text>
    <text x="12" y="182" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• Dual-custody approval</text>
    <text x="12" y="200" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• Emergency bypass log</text>

    <rect x="10" y="212" width="124" height="16" rx="4" fill="#4338ca" fill-opacity="0.4"/>
    <text x="72" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="600" fill="#c7d2fe">Zero Trust Authorization</text>
  </g>

  <!-- ARROW 2 -->
  <text x="328" y="180" text-anchor="middle" font-size="14" fill="#6366f1">→</text>

  <!-- STEP 3 -->
  <g transform="translate(336, 85)">
    <rect width="144" height="235" rx="10" fill="url(#step-grad)" stroke="#10b981" stroke-width="1.2"/>
    <rect width="144" height="26" rx="10" fill="#10b981" fill-opacity="0.15"/>
    <text x="72" y="18" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="800" fill="#6ee7b7">STAGE 3</text>
    <circle cx="72" cy="55" r="20" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="72" y="61" text-anchor="middle" font-size="18">⚡</text>

    <text x="72" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">JIT Elevation</text>

    <line x1="15" y1="108" x2="129" y2="108" stroke="#1e3a5f" stroke-width="0.8"/>
    
    <text x="12" y="128" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#34d399">Ephemeral Grants:</text>
    <text x="12" y="146" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• Dynamic credentials</text>
    <text x="12" y="164" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• Secret hidden from user</text>
    <text x="12" y="182" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• Fixed TTL duration</text>
    <text x="12" y="200" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• Target isolation</text>

    <rect x="10" y="212" width="124" height="16" rx="4" fill="#047857" fill-opacity="0.4"/>
    <text x="72" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="600" fill="#a7f3d0">Time-Bound Credential</text>
  </g>

  <!-- ARROW 3 -->
  <text x="486" y="180" text-anchor="middle" font-size="14" fill="#10b981">→</text>

  <!-- STEP 4 -->
  <g transform="translate(494, 85)">
    <rect width="144" height="235" rx="10" fill="url(#step-grad)" stroke="#f59e0b" stroke-width="1.2"/>
    <rect width="144" height="26" rx="10" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="72" y="18" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="800" fill="#fde68a">STAGE 4</text>
    <circle cx="72" cy="55" r="20" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <text x="72" y="61" text-anchor="middle" font-size="18">🎥</text>

    <text x="72" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Active Session</text>

    <line x1="15" y1="108" x2="129" y2="108" stroke="#1e3a5f" stroke-width="0.8"/>
    
    <text x="12" y="128" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#fbbf24">Session Governance:</text>
    <text x="12" y="146" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• Proxied connection</text>
    <text x="12" y="164" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• Keystroke recording</text>
    <text x="12" y="182" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• Dangerous cmd block</text>
    <text x="12" y="200" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• Live session takeover</text>

    <rect x="10" y="212" width="124" height="16" rx="4" fill="#b45309" fill-opacity="0.4"/>
    <text x="72" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="600" fill="#fef3c7">Full Visibility</text>
  </g>

  <!-- ARROW 4 -->
  <text x="644" y="180" text-anchor="middle" font-size="14" fill="#f59e0b">→</text>

  <!-- STEP 5 -->
  <g transform="translate(652, 85)">
    <rect width="148" height="235" rx="10" fill="url(#step-grad)" stroke="#00B8FF" stroke-width="1.2"/>
    <rect width="148" height="26" rx="10" fill="#00B8FF" fill-opacity="0.15"/>
    <text x="74" y="18" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="800" fill="#00B8FF">STAGE 5</text>
    <circle cx="74" cy="55" r="20" fill="#00B8FF" fill-opacity="0.15" stroke="#00B8FF" stroke-width="1"/>
    <text x="74" y="61" text-anchor="middle" font-size="18">📊</text>

    <text x="74" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Expiry &amp; Audit</text>

    <line x1="15" y1="108" x2="133" y2="108" stroke="#1e3a5f" stroke-width="0.8"/>
    
    <text x="12" y="128" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#38bdf8">Revocation &amp; Logs:</text>
    <text x="12" y="146" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• Auto session kill</text>
    <text x="12" y="164" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• Privilege deprovisioned</text>
    <text x="12" y="182" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• Tamper-proof SIEM log</text>
    <text x="12" y="200" font-family="Arial,sans-serif" font-size="8.5" fill="#e2e8f0">• NCA audit readiness</text>

    <rect x="10" y="212" width="128" height="16" rx="4" fill="#0284c7" fill-opacity="0.4"/>
    <text x="74" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="600" fill="#e0f2fe">Zero Standing Rights</text>
  </g>

  <!-- Bottom Summary Callout -->
  <g transform="translate(20, 335)">
    <rect width="780" height="65" rx="8" fill="#0D1F35" stroke="#1e3a5f" stroke-width="1"/>
    <text x="25" y="26" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#00B8FF">OmniPriv Security Outcome:</text>
    <text x="25" y="46" font-family="Arial,sans-serif" font-size="10.5" fill="#94a3b8">Elevated access exists only for the duration of the approved ticket. No persistent credentials, complete auditability, and immediate alignment with Saudi NCA cybersecurity directives.</text>
  </g>
</svg>
