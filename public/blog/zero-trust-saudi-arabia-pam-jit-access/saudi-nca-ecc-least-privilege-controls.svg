<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420">
  <defs>
    <linearGradient id="bg-nca" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="100%" style="stop-color:#030711"/>
    </linearGradient>
    <linearGradient id="card-nca" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e223a"/>
      <stop offset="100%" style="stop-color:#061426"/>
    </linearGradient>
    <linearGradient id="saudi-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="420" fill="url(#bg-nca)" rx="14"/>
  <rect x="1" y="1" width="818" height="418" fill="none" stroke="#1e3a5f" stroke-width="1" rx="13"/>

  <!-- Top Title Banner -->
  <rect x="30" y="20" width="760" height="58" rx="10" fill="#0D1F35" stroke="#00B8FF" stroke-width="1.2" stroke-opacity="0.4"/>
  <circle cx="65" cy="49" r="18" fill="#00B8FF" fill-opacity="0.15" stroke="#00B8FF" stroke-width="1"/>
  <text x="65" y="55" text-anchor="middle" font-size="18">🇸🇦</text>
  <text x="98" y="42" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="800" fill="#ffffff">Saudi NCA Cybersecurity Controls &amp; Zero Trust PAM</text>
  <text x="98" y="62" font-family="Arial,sans-serif" font-size="11.5" fill="#94a3b8">Operationalizing ECC 2-2-3-4 &amp; IAM Standard Template Through Least Privilege and JIT Access</text>

  <!-- 4 Framework Columns -->
  <!-- Pillar 1: NCA ECC 2-2-3-4 -->
  <g transform="translate(30, 95)">
    <rect width="175" height="295" rx="10" fill="url(#card-nca)" stroke="#059669" stroke-width="1.2"/>
    <rect width="175" height="6" rx="3" fill="#10b981"/>
    <circle cx="87" cy="42" r="20" fill="#059669" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="87" y="48" text-anchor="middle" font-size="18">📜</text>
    <text x="87" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#34d399">ECC Control 2-2-3-4</text>
    <text x="87" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Privileged Access Mgmt</text>

    <line x1="20" y1="112" x2="155" y2="112" stroke="#1e3a5f" stroke-width="0.8"/>

    <text x="18" y="132" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" fill="#e2e8f0">• Mandated PAM Framework</text>
    <text x="18" y="148" font-family="Arial,sans-serif" font-size="8.5" fill="#94a3b8">Governs all elevated accounts</text>

    <text x="18" y="174" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" fill="#e2e8f0">• Segregation of Duties</text>
    <text x="18" y="190" font-family="Arial,sans-serif" font-size="8.5" fill="#94a3b8">Prevents unchecked power</text>

    <text x="18" y="216" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" fill="#e2e8f0">• Formal Approvals</text>
    <text x="18" y="232" font-family="Arial,sans-serif" font-size="8.5" fill="#94a3b8">Authorized by role &amp; need</text>

    <rect x="12" y="254" width="151" height="28" rx="6" fill="#064e3b" fill-opacity="0.7"/>
    <text x="87" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#a7f3d0">Mandatory NCA Standard</text>
  </g>

  <!-- Pillar 2: Least Privilege & Need-to-Know -->
  <g transform="translate(225, 95)">
    <rect width="175" height="295" rx="10" fill="url(#card-nca)" stroke="#00B8FF" stroke-width="1.2"/>
    <rect width="175" height="6" rx="3" fill="#00B8FF"/>
    <circle cx="87" cy="42" r="20" fill="#00B8FF" fill-opacity="0.2" stroke="#00B8FF" stroke-width="1"/>
    <text x="87" y="48" text-anchor="middle" font-size="18">⚖️</text>
    <text x="87" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#00B8FF">Least Privilege</text>
    <text x="87" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Need-to-Know / Use</text>

    <line x1="20" y1="112" x2="155" y2="112" stroke="#1e3a5f" stroke-width="0.8"/>

    <text x="18" y="132" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" fill="#e2e8f0">• Scoped Resource Access</text>
    <text x="18" y="148" font-family="Arial,sans-serif" font-size="8.5" fill="#94a3b8">No broad enterprise rights</text>

    <text x="18" y="174" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" fill="#e2e8f0">• Task-Specific Elevation</text>
    <text x="18" y="190" font-family="Arial,sans-serif" font-size="8.5" fill="#94a3b8">Restricted to current ticket</text>

    <text x="18" y="216" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" fill="#e2e8f0">• Zero Standing Rights</text>
    <text x="18" y="232" font-family="Arial,sans-serif" font-size="8.5" fill="#94a3b8">Accounts idle by default</text>

    <rect x="12" y="254" width="151" height="28" rx="6" fill="#0c4a6e" fill-opacity="0.7"/>
    <text x="87" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#7dd3fc">Policy-Enforced PoLP</text>
  </g>

  <!-- Pillar 3: Session-Based JIT Access -->
  <g transform="translate(420, 95)">
    <rect width="175" height="295" rx="10" fill="url(#card-nca)" stroke="#6366f1" stroke-width="1.2"/>
    <rect width="175" height="6" rx="3" fill="#6366f1"/>
    <circle cx="87" cy="42" r="20" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1"/>
    <text x="87" y="48" text-anchor="middle" font-size="18">⏳</text>
    <text x="87" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#818cf8">Session-Based JIT</text>
    <text x="87" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#94a3b8">NCA IAM Template</text>

    <line x1="20" y1="112" x2="155" y2="112" stroke="#1e3a5f" stroke-width="0.8"/>

    <text x="18" y="132" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" fill="#e2e8f0">• Ephemeral Validity</text>
    <text x="18" y="148" font-family="Arial,sans-serif" font-size="8.5" fill="#94a3b8">Fixed session duration</text>

    <text x="18" y="174" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" fill="#e2e8f0">• Servers &amp; Databases</text>
    <text x="18" y="190" font-family="Arial,sans-serif" font-size="8.5" fill="#94a3b8">Covers Linux, Windows, SQL</text>

    <text x="18" y="216" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" fill="#e2e8f0">• Automatic Revocation</text>
    <text x="18" y="232" font-family="Arial,sans-serif" font-size="8.5" fill="#94a3b8">Zero persistent access</text>

    <rect x="12" y="254" width="151" height="28" rx="6" fill="#312e81" fill-opacity="0.7"/>
    <text x="87" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#c7d2fe">Time-Bound Security</text>
  </g>

  <!-- Pillar 4: Audit & Continuous Monitoring -->
  <g transform="translate(615, 95)">
    <rect width="175" height="295" rx="10" fill="url(#card-nca)" stroke="#f59e0b" stroke-width="1.2"/>
    <rect width="175" height="6" rx="3" fill="#f59e0b"/>
    <circle cx="87" cy="42" r="20" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
    <text x="87" y="48" text-anchor="middle" font-size="18">🔍</text>
    <text x="87" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Continuous Audit</text>
    <text x="87" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Log Monitoring &amp; SIEM</text>

    <line x1="20" y1="112" x2="155" y2="112" stroke="#1e3a5f" stroke-width="0.8"/>

    <text x="18" y="132" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" fill="#e2e8f0">• Video &amp; Keystrokes</text>
    <text x="18" y="148" font-family="Arial,sans-serif" font-size="8.5" fill="#94a3b8">Full forensic accountability</text>

    <text x="18" y="174" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" fill="#e2e8f0">• Tamper-Proof Logs</text>
    <text x="18" y="190" font-family="Arial,sans-serif" font-size="8.5" fill="#94a3b8">Searchable audit trails</text>

    <text x="18" y="216" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" fill="#e2e8f0">• Real-Time SIEM Export</text>
    <text x="18" y="232" font-family="Arial,sans-serif" font-size="8.5" fill="#94a3b8">Instant SOC alert triggers</text>

    <rect x="12" y="254" width="151" height="28" rx="6" fill="#78350f" fill-opacity="0.7"/>
    <text x="87" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#fde68a">100% Traceability</text>
  </g>
</svg>
